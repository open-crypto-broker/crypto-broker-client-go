version: '3'

vars:
  BUF_VERSION: "1.73.0"
  # Keep in sync with google.golang.org/protobuf in go.mod
  PROTOC_GEN_GO_VERSION: "1.36.12"
  PROTOC_GEN_GO_GRPC_VERSION: "1.6.2"
  GOVULNCHECK_VERSION: "1.8.0"
  GOLANGCI_LINT_VERSION: "2.14.0"

tasks:
  ################# Development Tools ####################
  # Additional resources:
  # - https://go.dev/doc/install
  # - https://buf.build/docs/installation
  # - https://buf.build/docs/lint/rules
  # - https://go.dev/doc/tutorial/govulncheck
  tools:
    desc: "Download tools required for development"
    deps: [install-buf, install-go-protoc-modules, install-go-vulnerability-check, install-golangci-lint]
    cmds:
      - buf --version && protoc-gen-go --version && govulncheck --version && golangci-lint --version

  # Installed via go install rather than brew so that every platform gets the
  # pinned version.
  install-buf:
    desc: "Download and install the buf CLI"
    cmds:
      - go install github.com/bufbuild/buf/cmd/buf@v{{.BUF_VERSION}}

  # Installed via go install rather than brew so that generated stubs are
  # reproducible across macOS, Linux and CI.
  install-go-protoc-modules:
    desc: "Install Go modules for protobuf and gRPC support"
    cmds:
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@v{{.PROTOC_GEN_GO_VERSION}}
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v{{.PROTOC_GEN_GO_GRPC_VERSION}}

  install-go-vulnerability-check:
    desc: "Install Go vulnerability checking tool"
    cmds:
      - go install golang.org/x/vuln/cmd/govulncheck@v{{.GOVULNCHECK_VERSION}}

  install-golangci-lint:
    desc: "Install golangci-lint"
    cmds:
      - curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin v{{.GOLANGCI_LINT_VERSION}}

  ################# Build Go Client ####################
  proto-update:
    desc: "Updates the protobuf submodule to the latest upstream schema and regenerates"
    cmds:
      - git submodule update --remote protobuf/
      - task: proto

  proto:
    desc: "Generates Go stubs from the pinned proto submodule"
    cmds:
      - buf generate

  ################# Continuous Improvement Tasks ####################
  check-dependencies:
    desc: "Set the dependencies"
    cmds:
      - go mod tidy && go mod verify

  format:
    desc: "Apply formatting rules to Go code"
    cmds:
      - go fmt ./...

  lint:
    desc: "Apply linting to Go code"
    cmds:
      - go vet ./...

  unit-test:
    desc: "Run unit-tests"
    cmds:
      - go test ./... -cover

  golangci-lint:
    desc: "Run golangci-lint"
    deps: [install-golangci-lint]
    cmds:
      - golangci-lint run ./...

  vulnerability-check:
    desc: "Run vulnerability check"
    deps: [install-go-vulnerability-check]
    cmds:
      - govulncheck ./...

  ci:
    desc: "Runs continuous integration checks on source code"
    cmds:
      - task: check-dependencies
      - task: format
      - task: lint
      - task: golangci-lint
      - task: unit-test
      - task: vulnerability-check
